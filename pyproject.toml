[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "zarkdown"
version = "2.1.0"
authors = [
    { name = "yangzizhoudiwuxuande", email = "yangzizhou2026@outlook.com" },
]
description = "Zarkdown - 键盘友好型纯文本标记语言"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.6"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]

dependencies = []

[project.scripts]
zarkdown = "zarkdown.cli:main"

[project.urls]
Homepage = "https://github.com/yangzizhoudiwuxuande/zarkdown"
"Bug Tracker" = "https://github.com/yangzizhoudiwuxuande/zarkdown/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
zarkdown = ["*.py"]
